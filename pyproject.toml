[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osva"
version = "0.1.0"
description = "Validation and analysis utilities for binned organoid MEA spike data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "streamlit>=1.39",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
